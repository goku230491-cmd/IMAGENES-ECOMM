name: Deploy to GitHub Pages

# Publica a GitHub Pages cada vez que subes un archivo nuevo (commit) a la rama principal.
# Tu unico paso es subir el archivo (index.html) al repo. Este Action hace el resto.

on:
  push:
    branches:
      - main   # <-- Si tu rama principal es "master", cambia esta linea a: - master
  workflow_dispatch:   # permite lanzarlo a mano desde la pestana Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Cancela publicaciones en curso si llega un commit nuevo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # publica todo el repo (index.html en la raiz)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

